// OmniLang CLI Application Template
// Command-line interface application

// ============================================
// PROJECT STRUCTURE
// ============================================
// src/
//   main.omni          - Application entry point
//   commands/          - Command implementations
//   config.omni        - Configuration
//   cli.omni           - CLI parser
// tests/
//   cli_test.omni      - Tests
// omni.toml           - Project configuration

// ============================================
// MAIN ENTRY POINT
// ============================================

fn main(args: [String]) -> Int:
    // Parse command line arguments
    let cli = CLI::new()
    let matches = cli.parse(args)
    
    // Handle --version
    if matches.contains_key("version"):
        println("myapp v1.0.0")
        println("OmniLang v" + std::version())
        return 0
    
    // Handle --help
    if matches.contains_key("help"):
        cli.print_help()
        return 0
    
    // Execute command
    match matches.get("command"):
        Some("greet") => return commands::greet(matches)
        Some("compute") => return commands::compute(matches)
        Some("serve") => return commands::serve(matches)
        Some(cmd) => 
            println("Unknown command: " + cmd)
            return 1
        None => 
            cli.print_help()
            return 0

// ============================================
// CLI PARSER
// ============================================

module cli

struct CLIMatch:
    command: Option<String>
    values: HashMap<String, String>
    flags: HashMap<String, Bool>
    args: [String]

impl CLIMatch:
    pub fn new() -> CLIMatch:
        return CLIMatch {
            command: Option::None,
            values: HashMap::new(),
            flags: HashMap::new(),
            args: []
        }
    
    pub fn get(&self, key: String) -> Option<String>:
        return self.values.get(key)
    
    pub fn has_flag(&self, flag: String) -> Bool:
        return self.flags.get(flag).unwrap_or(false)
    
    pub fn contains_key(&self, key: String) -> Bool:
        return self.values.contains_key(key) || self.flags.contains_key(key)

pub struct CLI:
    name: String
    version: String
    description: String
    subcommands: HashMap<String, Command>

impl CLI:
    pub fn new() -> CLI:
        return CLI {
            name: "myapp".to_string(),
            version: "1.0.0".to_string(),
            description: "A sample CLI application".to_string(),
            subcommands: HashMap::new()
        }
    
    pub fn with_name(&mut self, name: String) -> CLI:
        self.name = name
        return self
    
    pub fn with_version(&mut self, version: String) -> CLI:
        self.version = version
        return self
    
    pub fn with_description(&mut self, desc: String) -> CLI:
        self.description = desc
        return self
    
    pub fn add_command(&mut self, cmd: Command) -> CLI:
        self.subcommands.set(cmd.name, cmd)
        return self
    
    pub fn parse(&self, args: [String]) -> CLIMatch:
        var matches = CLIMatch::new()
        
        if args.len() < 2:
            return matches
        
        let mut i = 1  // Skip program name
        
        // Parse global options
        while i < args.len():
            let arg = args[i]
            
            if arg == "--version":
                matches.flags.set("version", true)
                i = i + 1
            else if arg == "--help" || arg == "-h":
                matches.flags.set("help", true)
                i = i + 1
            else if arg.starts_with("--"):
                // Long option with value
                let opt = arg[2..]
                if i + 1 < args.len() && not args[i + 1].starts_with("-"):
                    matches.values.set(opt, args[i + 1])
                    i = i + 2
                else:
                    matches.flags.set(opt, true)
                    i = i + 1
            else if arg.starts_with("-"):
                // Short option
                let opt = arg[1..]
                if i + 1 < args.len() && not args[i + 1].starts_with("-"):
                    matches.values.set(opt, args[i + 1])
                    i = i + 2
                else:
                    matches.flags.set(opt, true)
                    i = i + 1
            else:
                // Positional argument or subcommand
                if matches.command.is_none():
                    matches.command = Option::Some(arg)
                else:
                    matches.args.push(arg)
                i = i + 1
        
        return matches
    
    pub fn print_help(&self):
        println(self.name + " v" + self.version)
        println("")
        println(self.description)
        println("")
        println("Usage:")
        println("  " + self.name + " <command> [options]")
        println("")
        println("Commands:")
        
        for (_, cmd) in self.subcommands.iter():
            println("  " + cmd.name + " - " + cmd.description)
        
        println("")
        println("Options:")
        println("  --help, -h     Show this help message")
        println("  --version      Show version information")

// ============================================
// COMMAND
// ============================================

struct Command:
    name: String
    description: String
    args: [Arg]
    options: [Option]
    handler: Fn(CLIMatch) -> Int

impl Command:
    pub fn new(name: String, description: String) -> Command:
        return Command {
            name: name,
            description: description,
            args: [],
            options: [],
            handler: |_| 0
        }
    
    pub fn with_arg(&mut self, arg: Arg) -> Command:
        self.args.push(arg)
        return self
    
    pub fn with_option(&mut self, opt: Option) -> Command:
        self.options.push(opt)
        return self
    
    pub fn with_handler(&mut self, handler: Fn(CLIMatch) -> Int) -> Command:
        self.handler = handler
        return self

struct Arg:
    name: String
    description: String
    required: Bool

struct Option:
    name: String
    short: String
    description: String
    has_value: Bool
    default: Option<String>

// ============================================
// COMMANDS
// ============================================

module commands

pub fn greet(matches: CLIMatch) -> Int:
    let name = matches.get("name").unwrap_or("World")
    let mut greeting = "Hello"
    
    if matches.has_flag("uppercase"):
        greeting = greeting.to_upper()
    
    println(greeting + ", " + name + "!")
    
    if matches.has_flag("exclaim"):
        println("!")
    
    return 0

pub fn compute(matches: CLIMatch) -> Int:
    let operation = matches.get("operation").unwrap_or("add")
    let a = matches.get("a").unwrap_or("0").parse_int().unwrap_or(0)
    let b = matches.get("b").unwrap_or("0").parse_int().unwrap_or(0)
    
    let result = match operation:
        "add" => a + b
        "sub" => a - b
        "mul" => a * b
        "div" => 
            if b == 0:
                println("Error: division by zero")
                return 1
            a / b
        "mod" => a % b
        _ => 
            println("Unknown operation: " + operation)
            return 1
    
    println(a.to_string() + " " + operation + " " + b.to_string() + " = " + result.to_string())
    
    return 0

pub fn serve(matches: CLIMatch) -> Int:
    let host = matches.get("host").unwrap_or("0.0.0.0")
    let port = matches.get("port").unwrap_or("8080").parse_int().unwrap_or(8080)
    let workers = matches.get("workers").unwrap_or("4").parse_int().unwrap_or(4)
    
    println("Starting server...")
    println("  Host: " + host)
    println("  Port: " + port.to_string())
    println("  Workers: " + workers.to_string())
    
    // In a real app, you would start the server here
    println("Server started! Press Ctrl+C to stop.")
    
    // Wait for signal
    // native_wait_for_signal()
    
    return 0
